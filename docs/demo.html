<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FicPhone · 交互示例</title><link rel="icon" href="logo.svg" type="image/svg+xml">
