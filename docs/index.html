<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FicPhone · 创作工作台</title><meta name="description" content="在浏览器里制作聊天截图、社交媒体与论坛体，或可探索的手机故事。工程保存在本机。"><link rel="icon" type="image/svg+xml" href="logo.svg"><link rel="stylesheet" href="app.css"><script src="vendor/html2canvas.min.js" defer></script><script src="icons.js" defer></script><script src="story.js" defer></script><script src="render.js" defer></script><script src="demo-media.js" defer></script><script src="feedback-config.js" defer></script><script src="fonts.js" defer></script><script src="font-licenses.js" defer></script><script src="guide.js" defer></script><script src="provided-gallery.js" defer></script><script src="app.js" defer></script><script src="locales.js" defer></script><script src="i18n.js" defer></script></head>
<body>
 <header class="topbar"><div class="brand"><img class="brandmark" src="logo.svg" alt="FicPhone 标志" width="36" height="36"><img class="brand-wordmark" src="wordmark.svg" alt="FicPhone"><span class="version">Beta 1.0</span></div><div class="topbar-settings"><button id="feedback" hidden>留言板</button><button id="help">使用指南</button><label class="ui-language-label" title="界面语言 / Interface language"><span>界面语言</span><select id="ui-language" aria-label="界面语言"><option value="auto">跟随系统</option><option value="zh">中文</option><option value="en">English</option><option value="ko">한국어</option><option value="ja">日本語</option></select></label></div><div class="projecttools"><a class="demo-link" href="demo.html">试玩示例</a><button id="projects">工程库</button><button id="characters">角色库</button><button id="preflight">导出检查</button><button id="undo" title="撤销">撤销</button><button id="redo" title="重做">重做</button><span id="save-status" role="status">正在载入…</span><span class="save-scope">仅此浏览器 · 请定期导出 JSON 备份</span><button id="load-demo">TWICE 示例</button><button id="import">导入工程</button><button id="backup">导出工程</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></header>
 <div class="modebar"><div class="modes" aria-label="创作方式"><button data-mode="screenshot" aria-pressed="true">截图创作</button><button data-mode="phone" aria-pressed="false">交互手机</button></div><span id="mode-caption">选择模板，直接编辑和导出</span></div>
 <div class="workspace"><aside class="library" aria-label="模板与内容"><div class="navlabel" id="nav-label">截图模板</div><nav id="navigation"></nav><div class="local-note"><span class="local-dot"></span> 无需注册 · 本机保存<br><span>记得导出工程备份</span></div></aside><main class="editor"><div class="editorheading"><span id="editor-eyebrow">聊天模板</span><h1 id="editor-title">KakaoTalk</h1></div><form id="editor-form" autocomplete="off"></form></main><section class="previewarea" aria-label="作品预览"><div class="previewtop"><div><span id="preview-title">截图预览</span><small id="preview-spec">iPhone 18 Pro</small></div><button id="reset-reader" hidden>重新试玩</button></div><div id="preview-stage"><div id="preview"></div></div><div class="exportbar" id="exportbar"></div><p class="previewhint" id="preview-hint"></p><details id="reader-debug" hidden><summary>剧情试玩记录</summary><div id="reader-debug-body"></div></details></section></div>
 <footer class="site-footer"><span>FicPhone · v1.0.0-beta.1</span><span>© 2026 · Created by anycolorulike</span><button id="privacy-notice">隐私与数据</button><button id="copyright-notice">版权与素材</button></footer>
 <div id="toast" role="status" aria-live="polite"></div>
 <dialog id="export-dialog"><form method="dialog"><div class="dialogtop"><h2>导出截图</h2><button aria-label="关闭">×</button></div><p id="export-summary"></p><div id="export-results"></div><button type="button" id="backup-after-export">另存 JSON 工程备份</button><p class="muted">若浏览器拦截连续下载，可逐张点击保存。PNG 是成品图片；继续编辑请另存 JSON 工程。</p></form></dialog>
<dialog id="info-dialog"><div class="dialogtop"><h2 id="info-title"></h2><form method="dialog"><button aria-label="关闭">×</button></form></div><div id="info-body"></div></dialog></body></html>
